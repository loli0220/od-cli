[package]
name = "od-cli"
version = "0.1.0"
edition = "2024"
authors = ["OneDrive CLI Contributors"]
description = "A powerful OneDrive CLI and interactive shell in Rust using Azure App"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "stream", "multipart", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
indicatif = { version = "0.18.6", features = ["tokio"] }
comfy-table = { version = "8.0.0", features = ["custom_styling"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.10"
futures-util = "0.3"
colored = "3.0"
anyhow = "1.0"
thiserror = "2.0"
open = "5.3"
rustyline = "18.0.1"
shlex = "2.0.1"
url = "2.5"
urlencoding = "2.1"
mime_guess = "2.0"
